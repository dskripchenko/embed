name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: The loader stays small
        run: node -e "const z=require('zlib'),fs=require('fs');const n=z.gzipSync(fs.readFileSync('dist/embed.js'),{level:9}).length;console.log('embed.js gzip',n);if(n>10*1024){console.error('loader over 10 KB gzipped');process.exit(1)}"

  browser:
    name: Browser check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Chromium, WebKit and their system libraries come with the image (matching
    # the playwright version in the lockfile): no apt, whose mirrors stall.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # A static ffmpeg (x264, VP9, Opus) from npm, for the media fixtures: no apt.
      - run: |
          npm install --prefix /tmp/ffmpeg --no-audit --no-fund ffmpeg-static@5.3.0
          echo "FFMPEG=/tmp/ffmpeg/node_modules/ffmpeg-static/ffmpeg" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/fixtures.mjs
      - run: pnpm check:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tests/browser/output
