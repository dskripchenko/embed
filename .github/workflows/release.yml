name: Release

# Changesets opens a "Version Packages" pull request when changesets land on
# main; merging that pull request is what publishes to npm.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Without an npm token the job still opens version pull requests but
      # does not try to publish: a release is then published by hand.
      # v2 reads the output of Changesets v3: v1 did not, so it pushed no tags
      # and made no GitHub releases after publishing.
      - name: Create release pull request or publish
        uses: changesets/action@v2.1.2
        with:
          publish-script: ${{ secrets.NPM_TOKEN != '' && 'pnpm release' || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
